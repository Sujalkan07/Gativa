<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" fill="none">
  <!-- Gativa Dynamic Flow Emblem -->
  <g transform="translate(2, 4)">
    <!-- Base track / circle segment -->
    <path d="M18 2C9.163 2 2 9.163 2 18s7.163 16 16 16c6.438 0 12.012-3.799 14.61-9.28" stroke="#0A1145" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Saffron upper motion arc -->
    <path d="M18 6c-6.627 0-12 5.373-12 12s5.373 12 12 12c4.83 0 9.02-2.85 10.97-7" stroke="#FF9933" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Central fast-forward arrow / junction node -->
    <path d="M15 13l6 5-6 5" stroke="#FF9933" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- India green forward velocity line -->
    <path d="M20 18h14" stroke="#138808" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Emerald signal node -->
    <circle cx="34" cy="18" r="3.2" fill="#138808"/>
  </g>

  <!-- Typography -->
  <g transform="translate(48, 26)">
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="0.5" fill="#0A1145">GAT<tspan fill="#FF9933">I</tspan>VA</text>
  </g>
  <g transform="translate(49, 37)">
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.2" fill="#545A90">INTELLIGENCE IN MOTION</text>
  </g>
</svg>
